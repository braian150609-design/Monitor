<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Monitor de Guardia</title>

<!-- Google Fonts: Orbitron/Rajdhani para números y datos técnicos, Inter para texto -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  /* ==========================================================
     VARIABLES DE COLOR — paleta oscura con acentos "neón"
     ========================================================== */
  :root{
    --bg: #0a0e14;
    --bg-degrade: radial-gradient(circle at 15% 10%, #0d1420 0%, #0a0e14 45%, #060911 100%);
    --panel-bg: rgba(255,255,255,0.035);
    --panel-bg-2: rgba(255,255,255,0.02);
    --panel-border: rgba(148,163,184,0.14);
    --cian: #22d3ee;
    --cian-suave: rgba(34,211,238,0.15);
    --verde: #34d399;
    --verde-suave: rgba(52,211,153,0.15);
    --ambar: #fbbf24;
    --ambar-suave: rgba(251,191,36,0.15);
    --rojo: #f87171;
    --rojo-suave: rgba(248,113,113,0.15);
    --texto: #e2e8f0;
    --texto-tenue: #64748b;
    --texto-tenue-2: #8b98ac;
  }

  *{ margin:0; padding:0; box-sizing:border-box; }

  html, body{
    width:100%; height:100%;
    overflow:hidden; /* pantalla de kiosco: nunca debe hacer scroll la página */
    background:var(--bg);
    color:var(--texto);
    font-family:'Inter', 'Barlow', sans-serif;
  }

  body{
    background:var(--bg-degrade);
  }

  /* ==========================================================
     LAYOUT GENERAL — "escenario" de tamaño FIJO 1920x1080.
     Se diseña siempre a este tamaño exacto y JavaScript lo escala (ver
     ajustarEscalaPantalla() al final del script) para que quepa completo
     en la pantalla real, sea cual sea la resolución que reporte el
     televisor/TV Box. Esto evita depender de que el navegador calcule bien
     vw/vh/clamp() — algunos navegadores de Smart TV lo hacen mal o reportan
     una resolución distinta a la física, lo que causaba que el contenido se
     viera cortado o con un tamaño incorrecto.
     ========================================================== */
  .dashboard{
    position:absolute;
    top:50%; left:50%;
    width:1920px; height:1080px;
    transform-origin: center center;
    /* El "transform: scale(...)" real lo aplica JS — este es solo el valor
       inicial antes de que el script corra, para evitar un parpadeo grande. */
    transform: translate(-50%, -50%);
    display:flex;
    flex-direction:column;
    padding: 15.12px 34px; /* tamaño fijo, calculado para pantalla 1920x1080 */
    gap: 15.12px; /* tamaño fijo, calculado para pantalla 1920x1080 */
  }

  /* ---------- Barra superior: título + reloj ---------- */
  .topbar{
    flex: 0 0 auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding: 15.12px 30px; /* tamaño fijo, calculado para pantalla 1920x1080 */
    background: var(--panel-bg);
    border: 1px solid var(--panel-border);
    border-radius: 16px;
    box-shadow: 0 0 40px rgba(34,211,238,0.05), inset 0 1px 0 rgba(255,255,255,0.03);
    backdrop-filter: blur(6px);
  }

  .titulo{
    display:flex; align-items:center; gap:14px;
    font-family:'Rajdhani', sans-serif;
    font-weight:700;
    letter-spacing: 3px;
    font-size: 28.08px; /* tamaño fijo, calculado para pantalla 1920x1080 */
    color: var(--texto);
    text-shadow: 0 0 18px rgba(34,211,238,0.25);
  }
  .titulo-icono{ font-size: 1.1em; filter: drop-shadow(0 0 6px rgba(34,211,238,0.5)); }

  .reloj-container{ text-align:right; line-height:1.05; }
  .reloj{
    font-family:'Orbitron', sans-serif;
    font-weight:700;
    font-size: 45.36px; /* tamaño fijo, calculado para pantalla 1920x1080 */
    color: var(--cian);
    text-shadow: 0 0 22px rgba(34,211,238,0.45);
    font-variant-numeric: tabular-nums;
  }
  .fecha{
    margin-top:4px;
    font-family:'Rajdhani', sans-serif;
    font-weight:600;
    letter-spacing: 1.5px;
    text-transform: capitalize;
    font-size: 17.28px; /* tamaño fijo, calculado para pantalla 1920x1080 */
    color: var(--texto-tenue-2);
  }

  /* ---------- Grid de 3 paneles ---------- */
  .paneles{
    flex: 1 1 auto;
    display:grid;
    grid-template-columns: 1fr 1.25fr 1fr;
    gap: 15.12px; /* tamaño fijo, calculado para pantalla 1920x1080 */
    min-height:0; /* permite que los hijos con scroll interno funcionen bien */
  }

  .panel{
    display:flex;
    flex-direction:column;
    min-height:0;
    background: linear-gradient(180deg, var(--panel-bg) 0%, var(--panel-bg-2) 100%);
    border:1px solid var(--panel-border);
    border-radius:18px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.03);
    backdrop-filter: blur(6px);
    overflow:hidden;
  }

  .panel-header{
    flex:0 0 auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding: 17.28px 24px; /* tamaño fijo, calculado para pantalla 1920x1080 */
    border-bottom: 1px solid var(--panel-border);
  }

  .panel-header h2{
    font-family:'Rajdhani', sans-serif;
    font-weight:700;
    letter-spacing:2.5px;
    font-size: 20.52px; /* tamaño fijo, calculado para pantalla 1920x1080 */
    color: var(--texto-tenue-2);
  }

  /* ---------- Indicador de estado (punto de color + hora) ---------- */
  .estado-indicador{
    display:flex; align-items:center; gap:7px;
    font-family:'Inter', sans-serif;
    font-size: 13px; /* tamaño fijo, calculado para pantalla 1920x1080 */
    color: var(--texto-tenue);
    white-space:nowrap;
  }
  .punto{
    width:9px; height:9px; border-radius:50%;
    background: var(--texto-tenue);
    box-shadow: 0 0 8px currentColor;
    transition: background-color .4s ease, box-shadow .4s ease;
    flex:0 0 auto;
  }
  .estado-indicador.ok .punto{ background: var(--verde); color: var(--verde); }
  .estado-indicador.error .punto{ background: var(--rojo); color: var(--rojo); animation: parpadeo-suave 1.6s ease-in-out infinite; }

  @keyframes parpadeo-suave{
    0%,100%{ opacity:1; }
    50%{ opacity:.35; }
  }

  .panel-contenido{
    flex:1 1 auto;
    min-height:0;
    padding: 19.44px 26px; /* tamaño fijo, calculado para pantalla 1920x1080 */
  }

  /* ==========================================================
     PANEL 1 — ALTITUD
     ========================================================== */
  .altitud-contenido{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap: 10.8px; /* tamaño fijo, calculado para pantalla 1920x1080 */
    text-align:center;
  }
  .valor-grande{
    font-family:'Orbitron', sans-serif;
    font-weight:700;
    font-size: 118.8px; /* tamaño fijo, calculado para pantalla 1920x1080 */
    line-height:1;
    color: var(--cian);
    text-shadow: 0 0 40px rgba(34,211,238,0.35);
    font-variant-numeric: tabular-nums;
    transition: opacity .28s ease;
  }
  .valor-grande.fade-out{ opacity:0; }
  .unidad{
    font-family:'Rajdhani', sans-serif;
    font-weight:600;
    letter-spacing:4px;
    font-size: 21.6px; /* tamaño fijo, calculado para pantalla 1920x1080 */
    color: var(--texto-tenue-2);
  }

  /* ==========================================================
     PANEL 2 — PERSONAL DE GUARDIA
     ========================================================== */
  .personal-scroll{
    overflow-y:auto;
    scrollbar-width:none; /* Firefox: sin barra visible */
  }
  .personal-scroll::-webkit-scrollbar{ display:none; } /* Chrome/Edge: sin barra visible */

  .tabla-personal{
    width:100%;
    border-collapse:collapse;
  }
  .tabla-personal thead th{
    position:sticky; top:0;
    background: #0d1320;
    text-align:left;
    font-family:'Rajdhani', sans-serif;
    font-weight:700;
    letter-spacing:1.5px;
    font-size: 14.58px; /* tamaño fijo, calculado para pantalla 1920x1080 */
    color: var(--texto-tenue-2);
    padding: 9.72px 10px; /* tamaño fijo, calculado para pantalla 1920x1080 */
    border-bottom:1px solid var(--panel-border);
  }
  .tabla-personal tbody td{
    padding: 16px 10px; /* tamaño fijo, calculado para pantalla 1920x1080 */
    font-size: 20px; /* tamaño fijo, calculado para pantalla 1920x1080 */
    border-bottom:1px solid rgba(148,163,184,0.07);
    transition: opacity .3s ease;
  }
  .tabla-personal tbody tr:last-child td{ border-bottom:none; }
  .col-nombre{ font-weight:600; color:var(--texto); }
  .col-cargo{ color:var(--texto-tenue-2); font-size:0.85em; }
  .col-entrada{ font-family:'Orbitron', sans-serif; font-variant-numeric: tabular-nums; color:var(--texto-tenue-2); }

  .estado-pill{
    display:inline-flex; align-items:center; gap:6px;
    padding: 4px 10px;
    border-radius:20px;
    font-family:'Rajdhani', sans-serif;
    font-weight:700;
    letter-spacing:1px;
    font-size:0.8em;
    text-transform:uppercase;
  }
  .estado-pill .punto{ width:7px; height:7px; }
  .estado-pill.presente{ background:var(--verde-suave); color:var(--verde); }
  .estado-pill.presente .punto{ background:var(--verde); color:var(--verde); }
  .estado-pill.tardanza{ background:var(--ambar-suave); color:var(--ambar); }
  .estado-pill.tardanza .punto{ background:var(--ambar); color:var(--ambar); }
  .estado-pill.ausente{ background:var(--rojo-suave); color:var(--rojo); }
  .estado-pill.ausente .punto{ background:var(--rojo); color:var(--rojo); }

  .mensaje-vacio{
    text-align:center;
    color: var(--texto-tenue);
    padding-top: 6vh;
    font-size: 18px; /* tamaño fijo, calculado para pantalla 1920x1080 */
  }

  /* ==========================================================
     PANEL 3 — CLIMA
     ========================================================== */
  .clima-contenido{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap: 12.96px; /* tamaño fijo, calculado para pantalla 1920x1080 */
    text-align:center;
  }
  .clima-principal{
    display:flex; align-items:center; justify-content:center;
    gap: 18px; /* tamaño fijo, calculado para pantalla 1920x1080 */
  }
  .clima-icono{
    font-size: 86.4px; /* tamaño fijo, calculado para pantalla 1920x1080 */
    filter: drop-shadow(0 0 16px rgba(251,191,36,0.25));
    transition: opacity .3s ease;
  }
  .clima-temp{
    font-family:'Orbitron', sans-serif;
    font-weight:700;
    font-size: 97.2px; /* tamaño fijo, calculado para pantalla 1920x1080 */
    color: var(--ambar);
    text-shadow: 0 0 30px rgba(251,191,36,0.3);
    font-variant-numeric: tabular-nums;
    transition: opacity .3s ease;
  }
  .clima-resumen{
    font-family:'Rajdhani', sans-serif;
    font-weight:600;
    letter-spacing:1px;
    font-size: 23.76px; /* tamaño fijo, calculado para pantalla 1920x1080 */
    color: var(--texto);
    text-transform: capitalize;
  }
  .clima-detalles{
    margin-top: 10.8px; /* tamaño fijo, calculado para pantalla 1920x1080 */
    display:flex;
    gap: 34px; /* tamaño fijo, calculado para pantalla 1920x1080 */
  }
  .clima-dato{ display:flex; flex-direction:column; align-items:center; gap:4px; }
  .clima-dato-label{
    font-size: 13px; /* tamaño fijo, calculado para pantalla 1920x1080 */
    letter-spacing:1.5px;
    text-transform:uppercase;
    color: var(--texto-tenue);
  }
  .clima-dato-valor{
    font-family:'Rajdhani', sans-serif;
    font-weight:700;
    font-size: 25.92px; /* tamaño fijo, calculado para pantalla 1920x1080 */
    color: var(--verde);
  }

</style>
</head>
<body>

  <div class="dashboard">

    <!-- ============ BARRA SUPERIOR: título + reloj en vivo ============ -->
    <header class="topbar">
      <div class="titulo">
        <span class="titulo-icono">🛰️</span>
        <span>MONITOR DE GUARDIA</span>
      </div>
      <div class="reloj-container">
        <div id="reloj" class="reloj">--:--:--</div>
        <div id="fecha" class="fecha">cargando fecha…</div>
      </div>
    </header>

    <!-- ============ 3 PANELES PRINCIPALES ============ -->
    <main class="paneles">

      <!-- ---------- PANEL 1: ALTITUD ---------- -->
      <section class="panel panel-altitud">
        <div class="panel-header">
          <h2>Río Limón</h2>
          <div class="estado-indicador" id="estado-altitud">
            <span class="punto"></span><span class="texto-estado">sin datos</span>
          </div>
        </div>
        <div class="panel-contenido altitud-contenido">
          <div class="valor-grande" id="valor-altitud">----</div>
          <div class="unidad">msnm</div>
        </div>
      </section>

      <!-- ---------- PANEL 2: PERSONAL DE GUARDIA ---------- -->
      <section class="panel panel-personal">
        <div class="panel-header">
          <h2>Personal de guardia</h2>
          <div class="estado-indicador" id="estado-personal">
            <span class="punto"></span><span class="texto-estado">sin datos</span>
          </div>
        </div>
        <div class="panel-contenido personal-scroll" id="personal-scroll">
          <table class="tabla-personal" id="tabla-personal">
            <thead>
              <tr>
                <th>Nombre</th>
                <th>Cargo</th>
                <th>Entrada</th>
                <th>Estado</th>
              </tr>
            </thead>
            <tbody id="personal-tbody">
              <tr><td colspan="4" class="mensaje-vacio">Esperando datos de asistencia…</td></tr>
            </tbody>
          </table>
        </div>
      </section>

      <!-- ---------- PANEL 3: CLIMA ---------- -->
      <section class="panel panel-clima">
        <div class="panel-header">
          <h2>Clima — San Rafael de El Moján</h2>
          <div class="estado-indicador" id="estado-clima">
            <span class="punto"></span><span class="texto-estado">sin datos</span>
          </div>
        </div>
        <div class="panel-contenido clima-contenido">
          <div class="clima-principal">
            <div class="clima-icono" id="clima-icono">🌤️</div>
            <div class="clima-temp" id="clima-temp">--°</div>
          </div>
          <div class="clima-resumen" id="clima-resumen">Cargando…</div>
          <div class="clima-detalles">
            <div class="clima-dato">
              <span class="clima-dato-label">Sensación</span>
              <span class="clima-dato-valor" id="clima-sensacion">--°</span>
            </div>
            <div class="clima-dato">
              <span class="clima-dato-label">Humedad</span>
              <span class="clima-dato-valor" id="clima-humedad">--%</span>
            </div>
            <div class="clima-dato">
              <span class="clima-dato-label">Viento</span>
              <span class="clima-dato-valor" id="clima-viento">-- km/h</span>
            </div>
          </div>
        </div>
      </section>

    </main>
  </div>

<script>
/* ============================================================================
   MONITOR DE GUARDIA — lógica del dashboard
   Pensado para dejarse abierto 24/7 en el navegador de una TV / mini PC.
   ============================================================================ */

/* ==========================================================================
   0) COMPATIBILIDAD — navegadores de Smart TV suelen traer un motor de
   JavaScript más viejo. Este archivo evita a propósito sintaxis muy reciente
   (como "??" y "?." del 2020) que en esos navegadores rompe el script COMPLETO
   (nada llega a ejecutarse, ni siquiera el reloj). "def()" hace lo mismo que
   "??" (devuelve el primer valor que no sea null/undefined) pero de forma
   compatible con motores más antiguos.
   ========================================================================== */
function def(){
  for (var i = 0; i < arguments.length; i++){
    if (arguments[i] !== null && arguments[i] !== undefined) return arguments[i];
  }
  return undefined;
}


/* ==========================================================================
   0.5) ESCALADO A PANTALLA COMPLETA
   El contenido (".dashboard") está diseñado a un tamaño FIJO de 1920x1080.
   Esta función mide el tamaño REAL disponible en el navegador y aplica un
   "transform: scale(...)" para que ese diseño de 1920x1080 quepa completo y
   centrado, sea cual sea la resolución que el televisor/TV Box esté
   reportando (algunos la reportan mal, o aplican su propio zoom/escalado de
   sistema, lo que antes causaba que el contenido se viera cortado o con un
   tamaño incorrecto).
   ========================================================================== */
function ajustarEscalaPantalla(){
  var el = document.querySelector('.dashboard');
  if (!el) return;
  var ancho = window.innerWidth;
  var alto = window.innerHeight;
  var escala = Math.min(ancho / 1920, alto / 1080);
  el.style.transform = 'translate(-50%, -50%) scale(' + escala + ')';
}
ajustarEscalaPantalla();
window.addEventListener('resize', ajustarEscalaPantalla);
window.addEventListener('orientationchange', ajustarEscalaPantalla);
// Respaldo extra: algunos navegadores de Smart TV no disparan bien el evento
// "resize" — se vuelve a calcular cada pocos segundos por si acaso (costo casi nulo).
setInterval(ajustarEscalaPantalla, 3000);


/* ==========================================================================
   1) CONFIGURACIÓN — EDITAR AQUÍ ANTES DE USAR EN PRODUCCIÓN
   ========================================================================== */

/* --- Panel de Altitud — Cloud Firestore, proyecto "control-hidrologico" ---
   Colección con las lecturas del río; se toma automáticamente el documento
   más reciente (ordenando por "fecha" y "hora" descendente). */
const MSNM_FIRESTORE_PROJECT_ID = "control-hidrologico";
const MSNM_FIRESTORE_COLLECTION = "lecturas_rio_limon";
const MSNM_FIRESTORE_CAMPO_FECHA = "fecha";   // string "YYYY-MM-DD", se usa para ordenar
const MSNM_FIRESTORE_CAMPO_HORA = "hora";     // string "HH:MM", se usa para ordenar (desempate del mismo día)
const MSNM_FIRESTORE_CAMPO_VALOR = "nivel";   // nombre del campo numérico que se muestra en pantalla
const MSNM_INTERVALO_MS = 30 * 1000;               // cada 30s (recomendado 30-60s)

/* --- Panel de Personal de Guardia — Cloud Firestore, proyecto "asistencias-6f64c" ---
   Se usa la REST API de Firestore (sin cargar el SDK completo). Se consulta la
   colección de asistencia filtrando por el campo "dateString" (formato "YYYY-MM-DD")
   igual al de hoy, y opcionalmente se completa el "cargo" de cada persona
   consultando su documento en la colección de usuarios (por "uid"). */
const ASISTENCIA_FIRESTORE_PROJECT_ID = "asistencias-6f64c";
const ASISTENCIA_FIRESTORE_COLLECTION = "attendance";       // colección con los registros IN/OUT
const ASISTENCIA_FIRESTORE_USERS_COLLECTION = "users";      // colección con el cargo por uid (dejar "" para omitir)
const ASISTENCIA_INTERVALO_MS = 30 * 1000;         // cada 30s (recomendado 30s-2min)

// Hora de corte (24h, zona Venezuela) a partir de la cual un "IN" se marca como TARDANZA.
const TARDANZA_HORA_LIMITE = "08:00";              // AJUSTAR según el horario real de guardia

// API opcional de turnos: si se llena, se usa para saber quién DEBÍA estar de guardia
// hoy y así poder marcar "ausente" a quien falte. Si se deja vacía, el panel solo
// muestra a quienes ya tengan registro de entrada hoy (sin fila de "ausentes").
const TURNOS_API_URL = "";       // ej: "https://tuservidor.com/api/turnos/hoy"
const TURNOS_API_KEY = "";

/* --- Panel de Clima -------------------------------------------------------
   Si WEATHER_API_URL se deja vacío ("") se usa Open-Meteo, que es gratuito
   y NO requiere API key. Si se completa con un proveedor propio (OpenWeatherMap,
   WeatherAPI, etc.) hay que ajustar el parseo dentro de actualizarClima(). */
const WEATHER_API_URL = "";        // dejar vacío para usar Open-Meteo
const WEATHER_API_KEY = "";        // dejar vacío si se usa Open-Meteo
const CIUDAD = "San Rafael de El Moján, Zulia, Venezuela";
// Coordenadas de respaldo por si falla la geolocalización automática por nombre.
const CIUDAD_LAT_FALLBACK = 10.9616;
const CIUDAD_LON_FALLBACK = -71.7299;
const WEATHER_INTERVALO_MS = 20 * 60 * 1000;       // cada 20 min (recomendado 15-30 min)


/* ==========================================================================
   2) RELOJ Y FECHA EN VIVO — America/Caracas, formato 24h
   ========================================================================== */
const elReloj = document.getElementById('reloj');
const elFecha = document.getElementById('fecha');

const DIAS_ES = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const MESES_ES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];

// Venezuela usa un huso horario FIJO (UTC-4) todo el año, sin horario de verano.
// Restar 4 horas al tiempo UTC y leer los campos con los métodos "getUTC..." da
// la hora de Venezuela sin depender de la zona horaria configurada en el navegador
// ni de su base de datos de husos horarios (que en algunos navegadores de Smart TV
// viene incompleta y hace fallar a Intl.DateTimeFormat con "timeZone").
function horaVenezuelaManual(fecha){
  return new Date(fecha.getTime() - 4 * 60 * 60 * 1000);
}
function dosDigitos(n){ return (n < 10 ? '0' : '') + n; }

function actualizarReloj(){
  const ahora = new Date();
  let hora, fecha;
  try {
    // Camino preferido: usa el nombre de zona horaria real (más preciso si el
    // navegador lo soporta bien).
    hora = new Intl.DateTimeFormat('es-VE', {
      timeZone: 'America/Caracas',
      hour: '2-digit', minute: '2-digit', second: '2-digit',
      hour12: false
    }).format(ahora);
    fecha = new Intl.DateTimeFormat('es-VE', {
      timeZone: 'America/Caracas',
      weekday: 'long', day: '2-digit', month: 'long', year: 'numeric'
    }).format(ahora);
  } catch (err){
    // Respaldo manual (ver comentario arriba de horaVenezuelaManual).
    const v = horaVenezuelaManual(ahora);
    hora = dosDigitos(v.getUTCHours()) + ':' + dosDigitos(v.getUTCMinutes()) + ':' + dosDigitos(v.getUTCSeconds());
    fecha = DIAS_ES[v.getUTCDay()] + ', ' + dosDigitos(v.getUTCDate()) + ' de ' + MESES_ES[v.getUTCMonth()] + ' de ' + v.getUTCFullYear();
  }
  elReloj.textContent = hora;
  elFecha.textContent = fecha;
}

// Formatea una hora (Date) en HH:MM, zona horaria Venezuela.
function formatoHoraCorta(fecha){
  if (!fecha) return '--:--';
  try {
    return new Intl.DateTimeFormat('es-VE', {
      timeZone: 'America/Caracas', hour: '2-digit', minute: '2-digit', hour12: false
    }).format(fecha);
  } catch (err){
    const v = horaVenezuelaManual(fecha);
    return dosDigitos(v.getUTCHours()) + ':' + dosDigitos(v.getUTCMinutes());
  }
}

// Cambia el texto de un elemento con un pequeño fade, en vez de un cambio brusco.
function actualizarConFade(el, nuevoTexto){
  if (!el || el.textContent === nuevoTexto) return;
  el.classList.add('fade-out');
  setTimeout(() => {
    el.textContent = nuevoTexto;
    el.classList.remove('fade-out');
  }, 220);
}

// Actualiza el indicador de estado (punto + texto) de un panel.
// "ultimoError" es opcional: si se pasa, se muestra en pantalla (ej. "HTTP 401") para
// poder diagnosticar el problema sin tener que abrir la consola del navegador (F12).
function actualizarIndicadorEstado(elIndicador, conectado, ultimaActualizacion, ultimoError){
  if (!elIndicador) return;
  elIndicador.classList.remove('ok', 'error');
  elIndicador.classList.add(conectado ? 'ok' : 'error');
  const textoEl = elIndicador.querySelector('.texto-estado');
  if (conectado){
    textoEl.textContent = `Actualizado ${formatoHoraCorta(ultimaActualizacion)}`;
    elIndicador.removeAttribute('title');
  } else {
    const sufijoError = ultimoError ? ` · ${ultimoError}` : '';
    textoEl.textContent = ultimaActualizacion
      ? `Desconectado · últ. dato ${formatoHoraCorta(ultimaActualizacion)}${sufijoError}`
      : `Desconectado${sufijoError}`;
    if (ultimoError) elIndicador.title = ultimoError; // texto completo al pasar el mouse (o control remoto con foco)
  }
}

// Consulta en Firestore el documento más reciente de la colección de lecturas
// (ordenando por fecha y hora descendente — ambos strings comparables lexicográficamente:
// "YYYY-MM-DD" y "HH:MM" ordenan igual que el tiempo real).
// Nota: usa valorFirestore()/objetoDesdeCamposFirestore(), definidas más abajo junto al
// panel de Personal — en JS las funciones declaradas con "function" quedan disponibles
// en todo el script sin importar el orden en que aparecen.
async function obtenerUltimaLecturaAltitudFirestore(){
  const url = `https://firestore.googleapis.com/v1/projects/${MSNM_FIRESTORE_PROJECT_ID}/databases/(default)/documents:runQuery`;
  // Se ordena por UN solo campo (fecha) para no depender de un índice compuesto
  // (Firestore exige crear uno manualmente si se ordena por 2+ campos a la vez).
  // Se piden varios documentos del día más reciente y, entre esos, se elige la
  // hora más alta ya en el navegador — así no hace falta tocar nada en la consola de Firebase.
  const body = {
    structuredQuery: {
      from: [{ collectionId: MSNM_FIRESTORE_COLLECTION }],
      orderBy: [{ field: { fieldPath: MSNM_FIRESTORE_CAMPO_FECHA }, direction: 'DESCENDING' }],
      limit: 50
    }
  };
  const resp = await fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });
  if (!resp.ok){
    const detalle = await resp.text().catch(() => '');
    throw new Error(`HTTP ${resp.status}${detalle ? ' — ' + detalle.slice(0, 200) : ''}`);
  }
  const filas = await resp.json();
  const documentos = filas.filter(f => f.document).map(f => objetoDesdeCamposFirestore(f.document.fields));
  if (documentos.length === 0){
    throw new Error(`La colección "${MSNM_FIRESTORE_COLLECTION}" no tiene lecturas todavía`);
  }

  // De los documentos recibidos, nos quedamos con los de la fecha más reciente
  // y, entre esos, con el de mayor hora (comparación de strings "YYYY-MM-DD"/"HH:MM" ordena bien).
  const fechaMasReciente = documentos.reduce(
    (max, d) => (def(d[MSNM_FIRESTORE_CAMPO_FECHA], '') > max ? d[MSNM_FIRESTORE_CAMPO_FECHA] : max), ''
  );
  const delDiaMasReciente = documentos.filter(d => def(d[MSNM_FIRESTORE_CAMPO_FECHA], '') === fechaMasReciente);
  delDiaMasReciente.sort((a, b) => def(a[MSNM_FIRESTORE_CAMPO_HORA], '').localeCompare(def(b[MSNM_FIRESTORE_CAMPO_HORA], '')));
  return delDiaMasReciente[delDiaMasReciente.length - 1];
}

async function actualizarAltitud(){
  try {
    const lectura = await obtenerUltimaLecturaAltitudFirestore();
    const valor = lectura[MSNM_FIRESTORE_CAMPO_VALOR];
    if (typeof valor !== 'number' || Number.isNaN(valor)){
      throw new Error(`El campo "${MSNM_FIRESTORE_CAMPO_VALOR}" no es un número en el último documento`);
    }

    estadoAltitud.valor = valor;
    estadoAltitud.conectado = true;
    estadoAltitud.ultimoError = null;
    estadoAltitud.ultimaActualizacion = new Date();
  } catch (err){
    // No rompemos la UI: solo marcamos desconectado y conservamos el último valor válido.
    estadoAltitud.conectado = false;
    estadoAltitud.ultimoError = err.message;
    console.error('[Altitud] Error al actualizar:', err);
  }
  renderAltitud();
}

function renderAltitud(){

  // a 0 decimales si en tu caso el valor real siempre es un número entero.
  const texto = estadoAltitud.valor !== null

}

// Normaliza el texto de estado que venga de la API a una de las 3 categorías esperadas.
function normalizarEstadoAsistencia(valor){
  const v = (valor || '').toString().toLowerCase();
  if (v.includes('tard')) return 'tardanza';
  if (v.includes('ausen')) return 'ausente';
  return 'presente';
}

// Convierte un timestamp en cualquier formato razonable (número en ms o s, string
// ISO, string "HH:MM", o un objeto tipo Firestore { seconds, nanoseconds }) a Date.
function parsearTimestamp(valor){
  if (valor === undefined || valor === null) return null;
  if (typeof valor === 'number'){
    return new Date(valor < 1e12 ? valor * 1000 : valor); // segundos vs milisegundos
  }
  if (typeof valor === 'object' && typeof valor.seconds === 'number'){
    return new Date(valor.seconds * 1000);
  }
  if (typeof valor === 'string'){
    if (/^\d{1,2}:\d{2}$/.test(valor)){ // "HH:MM" suelto → usar la fecha de hoy
      const hoy = new Date();
      const [h, m] = valor.split(':').map(Number);
      hoy.setHours(h, m, 0, 0);
      return hoy;
    }
    const d = new Date(valor);
    return Number.isNaN(d.getTime()) ? null : d;
  }
  return null;
}

// ¿La hora de entrada (Date) cae después de la hora límite configurada?
// Comparación de strings "HH:MM" en 24h funciona correctamente por orden lexicográfico.
function esTardanza(fechaEntrada){
  return formatoHoraCorta(fechaEntrada) > TARDANZA_HORA_LIMITE;
}

// Construye la fila { nombre, cargo, entrada, estado } a partir de TODOS los registros
// de una misma persona (puede tener varios eventos IN/OUT en el día).
// - "entrada" siempre muestra la hora del último IN (nunca la hora de un OUT).
// - "estado" depende del ÚLTIMO evento en general: si fue OUT, ya se retiró (ausente);
//   si fue IN, se compara la hora contra TARDANZA_HORA_LIMITE.
function construirFilaPersonal(registros){
  const ultimo = registros[registros.length - 1]; // registros ya vienen ordenados por hora ascendente
  const nombre = def(ultimo.nombre, ultimo.name, '—');
  const cargo = def(ultimo.cargo, ultimo.rol, ultimo.role, ultimo.puesto, '—');

  // Último evento de tipo IN (si existe) → de ahí sale la hora de entrada mostrada.
  const ultimoIn = def([...registros].reverse().find(r => r.type === 'IN'), ultimo);
  const tsEntrada = parsearTimestamp(def(ultimoIn.timestamp, ultimoIn.hora_entrada, ultimoIn.entrada));
  const entrada = tsEntrada ? formatoHoraCorta(tsEntrada) : def(ultimoIn.hora_entrada, ultimoIn.entrada, '--:--');

  let estado;
  if (ultimo.estado || ultimo.status){
    estado = normalizarEstadoAsistencia(def(ultimo.estado, ultimo.status));
  } else if (ultimo.type === 'OUT'){
    estado = 'ausente'; // ya marcó salida
  } else {
    // último evento es "IN" (o no trae campo type): comparar la hora contra TARDANZA_HORA_LIMITE
    estado = (tsEntrada && esTardanza(tsEntrada)) ? 'tardanza' : 'presente';
  }
  return { nombre, cargo, entrada, estado, uid: ultimo.uid, cedula: ultimo.cedula };
}

// Los datos de Realtime Database pueden venir como objeto { pushId: {...}, ... } o arreglo.
// Se agrupan TODOS los eventos por persona (uid, cédula o nombre), ordenados por hora.
function normalizarRegistrosAsistencia(data){
  if (!data) return [];
  const registrosRaw = Array.isArray(data) ? data.filter(Boolean) : Object.values(data);

  const porPersona = new Map();
  for (const r of registrosRaw){
    if (!r || typeof r !== 'object') continue;
    const clave = def(r.uid, r.cedula, r.nombre, r.name);
    if (!clave) continue;
    if (!porPersona.has(clave)) porPersona.set(clave, []);
    porPersona.get(clave).push(r);
  }

  const filas = [];
  for (const registros of porPersona.values()){
    registros.sort((a, b) => {
      const ta = parsearTimestamp(def(a.timestamp, a.hora_entrada, a.entrada));
      const tb = parsearTimestamp(def(b.timestamp, b.hora_entrada, b.entrada));
      return (ta ? ta.getTime() : 0) - (tb ? tb.getTime() : 0);
    });
    filas.push(construirFilaPersonal(registros));
  }
  return filas;
}

// Consulta la API de turnos (opcional) para saber quién debía asistir hoy.
// Devuelve null si TURNOS_API_URL no está configurada, o si la consulta falla.
async function obtenerRosterTurnoHoy(){

/* --- Helpers de Firestore REST API (proyecto "asistencias-6f64c") ---
   Firestore envuelve cada valor en un objeto tipado ({ stringValue: "..." },
   { timestampValue: "..." }, etc.) — estas funciones lo "desenvuelven" a JS plano. */
function valorFirestore(v){
  if (v === undefined || v === null) return null;
  if ('stringValue' in v) return v.stringValue;
  if ('integerValue' in v) return Number(v.integerValue);
  if ('doubleValue' in v) return v.doubleValue;
  if ('booleanValue' in v) return v.booleanValue;
  if ('timestampValue' in v) return v.timestampValue; // ISO 8601, ej. "2026-08-25T12:30:20.123Z"
  if ('nullValue' in v) return null;
  if ('mapValue' in v) return objetoDesdeCamposFirestore(v.mapValue.fields || {});
  if ('arrayValue' in v) return (v.arrayValue.values || []).map(valorFirestore);
  return null;
}
function objetoDesdeCamposFirestore(fields){
  const obj = {};
  for (const [clave, valor] of Object.entries(fields || {})) obj[clave] = valorFirestore(valor);
  return obj;
}

// Fecha de hoy en formato "YYYY-MM-DD", zona horaria Venezuela (para filtrar por "dateString").
function fechaHoyISOCorta(){
  try {
    return new Intl.DateTimeFormat('en-CA', {
      timeZone: 'America/Caracas', year: 'numeric', month: '2-digit', day: '2-digit'
    }).format(new Date());
  } catch (err){
    const v = horaVenezuelaManual(new Date());
    const mes = v.getUTCMonth() + 1;
    return v.getUTCFullYear() + '-' + dosDigitos(mes) + '-' + dosDigitos(v.getUTCDate());
  }
}

// Consulta en Firestore los registros de asistencia de HOY (campo "dateString" == hoy).
async function obtenerRegistrosAsistenciaFirestore(){
  const url = `https://firestore.googleapis.com/v1/projects/${ASISTENCIA_FIRESTORE_PROJECT_ID}/databases/(default)/documents:runQuery`;
  const body = {
    structuredQuery: {
      from: [{ collectionId: ASISTENCIA_FIRESTORE_COLLECTION }],
      where: {
        fieldFilter: {
          field: { fieldPath: 'dateString' },
          op: 'EQUAL',
          value: { stringValue: fechaHoyISOCorta() }
        }
      }
    }
  };
  const resp = await fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });
  if (!resp.ok){
    const detalle = await resp.text().catch(() => '');
    throw new Error(`HTTP ${resp.status}${detalle ? ' — ' + detalle.slice(0, 200) : ''}`);
  }
  const filas = await resp.json();
  // runQuery devuelve un arreglo donde cada elemento trae { document } (o nada si no hay resultados).
  return filas.filter(f => f.document).map(f => objetoDesdeCamposFirestore(f.document.fields));
}

// Cargo/rol por uid, consultado (con caché en memoria) desde la colección de usuarios.
const cacheCargoPorUid = new Map();
async function obtenerCargoPorUid(uid){
  if (!uid || !ASISTENCIA_FIRESTORE_USERS_COLLECTION) return null;
  if (cacheCargoPorUid.has(uid)) return cacheCargoPorUid.get(uid);
  try {
    const url = `https://firestore.googleapis.com/v1/projects/${ASISTENCIA_FIRESTORE_PROJECT_ID}/databases/(default)/documents/${ASISTENCIA_FIRESTORE_USERS_COLLECTION}/${uid}`;
    const resp = await fetch(url);
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const doc = await resp.json();
    const campos = objetoDesdeCamposFirestore(doc.fields);
    // AJUSTAR el nombre del campo si en "users" el cargo se llama distinto.
    const cargo = def(campos.cargo, campos.rol, campos.role, campos.puesto, null);
    cacheCargoPorUid.set(uid, cargo);
    return cargo;
  } catch (err){
    cacheCargoPorUid.set(uid, null);
    return null;
  }
}

async function actualizarPersonal(){
  try {
    const registrosCrudos = await obtenerRegistrosAsistenciaFirestore();

    // Completa el cargo de cada persona consultando (una vez, con caché) la colección de usuarios.
    const uidsUnicos = [...new Set(registrosCrudos.map(r => r.uid).filter(Boolean))];
    await Promise.all(uidsUnicos.map(async uid => {
      const cargo = await obtenerCargoPorUid(uid);
      if (cargo) registrosCrudos.filter(r => r.uid === uid).forEach(r => { r.cargo = cargo; });
    }));

    let lista = normalizarRegistrosAsistencia(registrosCrudos);

    // Si hay API de turnos configurada, se agregan como "ausente" quienes debían
    // asistir hoy pero no tienen registro de entrada.
    const roster = await obtenerRosterTurnoHoy();
    if (roster){
      const presentesPorClave = new Set(lista.map(p => def(p.uid, p.cedula, p.nombre)));
      for (const persona of roster){
        const clave = def(persona.uid, persona.cedula, persona.nombre);
        if (!presentesPorClave.has(clave)){
          lista.push({ nombre: persona.nombre, cargo: persona.cargo, entrada: '--:--', estado: 'ausente' });
        }
      }
    }

    estadoPersonal.lista = lista;
    estadoPersonal.conectado = true;
    estadoPersonal.ultimoError = null;
    estadoPersonal.ultimaActualizacion = new Date();
  } catch (err){
    estadoPersonal.conectado = false;
    estadoPersonal.ultimoError = err.message;
    console.error('[Personal] Error al actualizar:', err);
  }
  renderPersonal();
}

function renderPersonal(){
  actualizarIndicadorEstado(elEstadoPersonal, estadoPersonal.conectado, estadoPersonal.ultimaActualizacion, estadoPersonal.ultimoError);

  if (estadoPersonal.lista.length === 0){

}

// Evita inyección accidental de HTML si algún campo trae caracteres especiales.
function escaparHtml(texto){
  const div = document.createElement('div');
  div.textContent = def(texto, '');
  return div.innerHTML;
}

// --- Scroll automático lento (carrusel vertical) para que quepa toda la lista
//     sin necesidad de interacción humana ni barra de scroll visible. ---
(function iniciarScrollAutomaticoPersonal(){
  const contenedor = elScrollPersonal;
  const VELOCIDAD_PX_POR_FRAME = 0.4;   // ajustar para más/menos velocidad
  const PAUSA_EXTREMOS_MS = 3000;       // pausa al llegar arriba/abajo

  let direccion = 1;
  let pausaHasta = 0;

  function paso(timestamp){
    requestAnimationFrame(paso);
    if (timestamp < pausaHasta) return;

    const desbordado = contenedor.scrollHeight > contenedor.clientHeight + 1;
    if (!desbordado) return; // si todo el personal cabe, no hace falta desplazar

    contenedor.scrollTop += direccion * VELOCIDAD_PX_POR_FRAME;

    const llegoAbajo = contenedor.scrollTop + contenedor.clientHeight >= contenedor.scrollHeight - 1;
    const llegoArriba = contenedor.scrollTop <= 0;

    if (llegoAbajo){
      direccion = -1;
      pausaHasta = timestamp + PAUSA_EXTREMOS_MS;
    } else if (llegoArriba){
      direccion = 1;
      pausaHasta = timestamp + PAUSA_EXTREMOS_MS;
    }
  }
  requestAnimationFrame(paso);
})();

// Obtiene lat/lon de CIUDAD vía el geocodificador gratuito de Open-Meteo.
// Si falla, usa las coordenadas de respaldo definidas arriba.
async function obtenerCoordenadasCiudad(){
  if (coordenadasCiudad) return coordenadasCiudad;
  try {
    const nombreBusqueda = CIUDAD.split(',')[0].trim();
    const url = `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(nombreBusqueda)}&count=1&language=es&country=VE`;
    const resp = await fetch(url);
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const data = await resp.json();
    if (data.results && data.results.length > 0){
      coordenadasCiudad = { lat: data.results[0].latitude, lon: data.results[0].longitude };
    } else {
      throw new Error('Ciudad no encontrada por geocodificación');
    }
  } catch (err){
    console.warn('[Clima] Geocodificación falló, usando coordenadas de respaldo:', err);
    coordenadasCiudad = { lat: CIUDAD_LAT_FALLBACK, lon: CIUDAD_LON_FALLBACK };
  }
  return coordenadasCiudad;
}

async function actualizarClima(){
  try {
    if (WEATHER_API_URL){
      /* -------------------------------------------------------------
         Proveedor propio configurado (ej. OpenWeatherMap, WeatherAPI).
         AJUSTAR el parseo de "data" según el formato real de esa API. */
      const resp = await fetch(`${WEATHER_API_URL}?key=${encodeURIComponent(WEATHER_API_KEY)}&q=${encodeURIComponent(CIUDAD)}`);
      if (!resp.ok) throw new Error('HTTP ' + resp.status);
      const data = await resp.json();

      // Ejemplo pensado para WeatherAPI.com — cambiar según el proveedor real.
      estadoClima.temp = data.current.temp_c;
      estadoClima.sensacion = data.current.feelslike_c;
      estadoClima.humedad = data.current.humidity;
      estadoClima.viento = data.current.wind_kph;
      estadoClima.resumen = def(data.current.condition && data.current.condition.text, 'Sin descripción');
      estadoClima.icono = '🌡️';
    } else {
      /* ------------------------- Open-Meteo (sin API key) ------------------------- */
      const { lat, lon } = await obtenerCoordenadasCiudad();
      const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}` +
        `&current=temperature_2m,relative_humidity_2m,apparent_temperature,wind_speed_10m,weather_code` +
        `&timezone=America%2FCaracas`;
      const resp = await fetch(url);
      if (!resp.ok) throw new Error('HTTP ' + resp.status);
      const data = await resp.json();
      const actual = data.current;
      if (!actual) throw new Error('Formato de respuesta inesperado');

      const [icono, resumen] = interpretarCodigoClima(actual.weather_code);
      estadoClima.temp = actual.temperature_2m;
      estadoClima.sensacion = actual.apparent_temperature;
      estadoClima.humedad = actual.relative_humidity_2m;
      estadoClima.viento = actual.wind_speed_10m;
      estadoClima.icono = icono;
      estadoClima.resumen = resumen;
    }

    estadoClima.conectado = true;
    estadoClima.ultimoError = null;
    estadoClima.ultimaActualizacion = new Date();
  } catch (err){
    estadoClima.conectado = false;
    estadoClima.ultimoError = err.message;
    console.error('[Clima] Error al actualizar:', err);
  }
  renderClima();
}

function renderClima(){
  actualizarConFade(elClimaTemp, estadoClima.temp !== null ? `${Math.round(estadoClima.temp)}°` : '--°');
  actualizarConFade(elClimaSensacion, estadoClima.sensacion !== null ? `${Math.round(estadoClima.sensacion)}°` : '--°');
  actualizarConFade(elClimaHumedad, estadoClima.humedad !== null ? `${Math.round(estadoClima.humedad)}%` : '--%');
  actualizarConFade(elClimaViento, estadoClima.viento !== null ? `${Math.round(estadoClima.viento)} km/h` : '-- km/h');
  actualizarConFade(elClimaResumen, def(estadoClima.resumen, estadoClima.conectado ? 'Sin datos' : 'Sin conexión'));
  if (elClimaIcono.textContent !== estadoClima.icono){
    elClimaIcono.classList.add('fade-out');
    setTimeout(() => {
      elClimaIcono.textContent = estadoClima.icono;
      elClimaIcono.classList.remove('fade-out');
    }, 220);
  }
  actualizarIndicadorEstado(elEstadoClima, estadoClima.conectado, estadoClima.ultimaActualizacion, estadoClima.ultimoError);
}


/* ==========================================================================
   7) ARRANQUE — primera carga inmediata + actualizaciones periódicas
   Cada panel corre en su propio setInterval: si uno falla, los demás
   siguen funcionando con total normalidad (cada fetch tiene su try/catch).
   ========================================================================== */
actualizarAltitud();
actualizarPersonal();
actualizarClima();

setInterval(actualizarAltitud, MSNM_INTERVALO_MS);
setInterval(actualizarPersonal, ASISTENCIA_INTERVALO_MS);
setInterval(actualizarClima, WEATHER_INTERVALO_MS);

</script>
